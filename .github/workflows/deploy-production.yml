name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/matthew
      ADMIN_EMAIL: hi@fengtalk.ai
      AMA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RATE_LIMIT_HASH_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      CRON_SECRET: build-only-placeholder
      BUNNY_MEDIA_REGION: sg
      BUNNY_MEDIA_ZONE: matthew-miao-media
      BUNNY_MEDIA_PASSWORD: build-only-placeholder
      BUNNY_MEDIA_CDN_URL: https://media.matthew-miao.com
      BUNNY_CDN_API_KEY: build-only-placeholder
      MEDIA_ENCRYPTION_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      SITE_URL: https://matthew-miao.com
      PUBLIC_SITE_URL: https://matthew-miao.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm typecheck
          pnpm test:unit
          pnpm test:localization
          pnpm build:cloudflare

      - name: Verify Cal.com booking contract
        if: ${{ env.CALCOM_API_KEY != '' }}
        run: pnpm verify:calcom

      - name: Deploy exact commit to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm exec opennextjs-cloudflare deploy

      - name: Report missing deployment credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::Validation passed, but CLOUDFLARE_API_TOKEN is not configured in the production environment."
          echo "### Cloudflare deployment skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the production secret CLOUDFLARE_API_TOKEN to enable automatic deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright Chromium
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production routes
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          PLAYWRIGHT_BASE_URL: https://matthew-miao.com
        run: pnpm test:browser:hosted
