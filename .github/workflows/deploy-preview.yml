name: Deploy Preview

on:
  push:
    branches-ignore: [main, dev]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    if: github.repository == 'matthew6688/matthew-miao' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/matthew
      ADMIN_EMAIL: hi@fengtalk.ai
      AMA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RATE_LIMIT_HASH_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      MEDIA_PUBLIC_BASE_URL: https://matthew-miao-preview.matthew6688.workers.dev/media/
      PHOTO_PUBLICATION_MODE: repository-bootstrap
      MEDIA_ENCRYPTION_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      SITE_URL: https://matthew-miao-preview.matthew6688.workers.dev
      PUBLIC_SITE_URL: https://matthew-miao-preview.matthew6688.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate application
        run: pnpm typecheck && pnpm test:blog-skill && pnpm test:photo-skill && pnpm test:localization && pnpm build:cloudflare
      - name: Deploy exact commit to Cloudflare Preview
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm exec opennextjs-cloudflare deploy --env preview
      - name: Sync provider secrets to Cloudflare Preview
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.STRIPE_SECRET_KEY != '' && env.STRIPE_WEBHOOK_SECRET != '' }}
        run: |
          jq -n \
            '{STRIPE_SECRET_KEY: env.STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET: env.STRIPE_WEBHOOK_SECRET}' \
            > "$RUNNER_TEMP/worker-secrets.json"
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json" --env preview
      - name: Report missing deployment credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Add preview CLOUDFLARE_API_TOKEN to enable automatic deployment."
      - name: Wait for Preview deployment convergence
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/wait-for-cloudflare-deployment.mjs "$PUBLIC_SITE_URL"
      - name: Install Playwright Chromium
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Preview in browser
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          PLAYWRIGHT_BASE_URL: https://matthew-miao-preview.matthew6688.workers.dev
        run: pnpm test:browser:hosted
